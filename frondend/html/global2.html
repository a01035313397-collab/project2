<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./data/favicon.ico" />
    <title>HTML 전역 속성</title>
  </head>
  <body>
    <!--
      속성: 전역 속성
      1) name
      2) class
      3) id
      4) style
      5) data-*
    -->

    <p name="" class="" id="" style="" data-content="">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Qui reprehenderit
      accusamus blanditiis, autem labore commodi modi placeat quibusdam error
      quaerat? Ab perspiciatis cupiditate minima voluptatem officiis.
    </p>

    <!--
      인라인 vs 블록: 요소가 배치되는 방식
      인라인: 옆으로 배치되는 요소
      블록: 하나의 행을 다 쓰는 요소
    -->

    <a href="#">네이버</a>
    <a href="#">구글</a>
    <a href="#">다음</a>

    <form action="">
      <input type="radio" name="" id="" />
      <input type="text" name="" id="" />
    </form>
  </body>
</html>
