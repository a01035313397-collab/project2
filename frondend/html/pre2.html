<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- pre : 미리 서식이 지정된 텍스트 그대로 표시 -->
    <pre>
Lorem ipsum dolor sit amet,


      consectetur adipisicing elit.


Autem facilis animi culpa id excepturi ipsam deleniti, nobis natus.
    </pre>

    <!-- 텍스트 강조 -->
    <p>
      <b>텍스트</b>
    </p>
    <p>
      <strong>텍스트</strong>
    </p>
    <p>
      <i>텍스트</i>
    </p>
    <p>
      <em>텍스트</em>
    </p>

    <!-- 아래 첨자와 위 첨자 -->
    <p>
      10<sub>2</sub> <br />
      10<sup>2</sup>
    </p>
    <!-- 헤딩 태그-->
    <h1>Heading1</h1>
    <h2>Heading2</h2>
    <h3>Heading3</h3>
    <h4>Heading4</h4>
    <h5>Heading5</h5>
    <h6>Heading6</h6>
  </body>
</html>
